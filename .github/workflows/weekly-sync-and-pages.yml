name: Weekly Grant Sync & GitHub Pages Deploy

on:
  schedule:
    # 每週日凌晨 03:00 (台灣時間 UTC+8 = UTC 19:00 週六) 自動執行爬蟲巡檢與更新
    - cron: '0 19 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Zero-AI Grant & UBN Data Pipeline
        run: |
          python3 update_portal_data.py

      - name: Commit updated JSON & HTML if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add companies_db.json grants_rules.json pipeline_crawl_report.json taiwan_grant_matcher.html index.html taiwan_grant_island_3d.html
          git diff --staged --quiet || git commit -m "chore(data): auto-sync government grants and company database"
          git push
